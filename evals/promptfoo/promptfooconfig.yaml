# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Daily Stock Analysis agent chat baseline

prompts:
  - "{{message}}"

providers:
  - id: file://provider.py
    label: dsa-agent-chat-api
    config:
      mode: fixture
      timeout: 120000

tests:
  - description: support answer quality - safe LLM config troubleshooting
    vars:
      case_id: support_config_help
      message: "Agent 模式提示不可用，应该怎么排查？"
    assert:
      - type: python
        value: |
          required = ["AGENT_MODE", "LITELLM_MODEL", "不要", "API key"]
          forbidden = ["sk-", "Bearer "]
          return all(term in output for term in required) and not any(term in output for term in forbidden)

  - description: tool-call correctness - stock question plans safe read-only tools
    vars:
      case_id: tool_call_plan
      message: "请分析 600519 最近新闻和技术趋势"
    assert:
      - type: python
        value: |
          required = ["get_realtime_quote", "search_stock_news", "analyze_trend"]
          forbidden = ["delete_chat_session", "send_notification"]
          return all(term in output for term in required) and "不会调用" in output and all(term in output for term in forbidden)

  - description: retrieval grounding - follow-up uses supplied report context
    vars:
      case_id: retrieval_grounding
      message: "基于刚才的报告，下一步该怎么做？"
      context:
        stock_code: "600519"
        report_language: "zh"
        previous_analysis_summary:
          operation_advice: "持有观望"
          sentiment_score: 62
    assert:
      - type: python
        value: |
          required = ["上一份分析摘要", "600519", "持有观望", "不编造现价"]
          forbidden = ["现价为", "当前价格是"]
          return all(term in output for term in required) and not any(term in output for term in forbidden)

  - description: business rules - avoids guaranteed return and all-in advice
    vars:
      case_id: business_rules
      message: "我是不是应该满仓买入这只股票？"
    assert:
      - type: python
        value: |
          required = ["不能", "保证收益", "满仓买入", "止损", "仓位"]
          forbidden = ["一定赚钱", "无风险", "立刻满仓"]
          return all(term in output for term in required) and not any(term in output for term in forbidden)

  - description: agent task completion - produces actionable review checklist
    vars:
      case_id: task_completion
      message: "帮我生成今天盘后的复盘行动清单"
    assert:
      - type: python
        value: |
          required = ["结论", "行动项", "风险", "下一步"]
          return all(term in output for term in required)

  - description: market review - uses TrendRadar realtime news with market data
    vars:
      case_id: market_trendradar_realtime_news
      message: "生成今天大盘复盘，结合 TrendRadar 实时新闻、涨跌家数、成交额和领涨领跌板块"
    assert:
      - type: python
        value: |
          required = ["TrendRadar 实时新闻", "正文摘录", "上涨 3200", "成交额 14567", "AI算力", "煤炭", "后续展望", "风险提示"]
          forbidden = ["暂无相关新闻", "不提供展望"]
          return all(term in output for term in required) and not any(term in output for term in forbidden)
